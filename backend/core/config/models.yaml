# Model Configuration
models:
  # OpenAI Models
  gpt-4o-mini:
    adapter: openai
    model: gpt-4o-mini
    description: Fast and affordable GPT-4 variant

  gpt-4o:
    adapter: openai
    model: gpt-4o
    description: Most capable OpenAI model

  # Anthropic Models
  claude-sonnet:
    adapter: anthropic
    model: claude-sonnet-4-5-20250929
    description: Balanced performance and speed

  claude-opus:
    adapter: anthropic
    model: claude-opus-4-20250514
    description: Most capable Claude model

  # vLLM Local Models
  tiny-llama:
    adapter: vllm
    model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    max_model_len: 2048
    gpu_memory_utilization: 0.5  # Use only 50% of GPU (4GB out of 8GB)
    description: Tiny local model (1.1B params, ~2.5GB)