# FAIForge Application Configuration

# API Server Settings
api:
  host: "0.0.0.0"
  port: 8000
  reload: true  # Auto-reload in development
  workers: 1    # Number of worker processes

# CORS Settings
cors:
  enabled: true
  origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

# Model Defaults
defaults:
  model: "gpt-4o-mini"
  temperature: 0.7
  max_tokens: 500

# Model Registry
models:
  config_path: "core/config/models.yaml"
  load_vllm: true  # Set to false to disable local models

# Observability (We'll use this in Session 4)
observability:
  log_level: "INFO"
  log_format: "json"  # or "text"
  request_logging: true

# Caching (Future feature)
cache:
  enabled: false
  backend: "redis"
  ttl_seconds: 3600

# Rate Limiting (Future feature)
rate_limit:
  enabled: false
  requests_per_minute: 60